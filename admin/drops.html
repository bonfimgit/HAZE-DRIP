<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Drops — Haze Drip</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>


<body class="admin-body">


<div class="admin-layout">


  <!-- SIDEBAR -->

  <aside class="admin-sidebar">


    <div class="admin-brand">

      <img
        src="../assets/haze-logo.webp"
        alt="Haze Drip"
      >

      <span>ADMIN</span>

    </div>


    <div class="admin-user">

      <div class="admin-avatar">
        HD
      </div>

      <div>

        <strong class="js-admin-nome">
          Gerente
        </strong>

        <span class="js-admin-perfil">
          Gerente
        </span>

      </div>

    </div>


    <nav class="admin-menu">

      <a
        href="dashboard.html"
        class="admin-menu-link"
      >
        Dashboard
      </a>

      <a
        href="produtos.html"
        class="admin-menu-link"
      >
        Produtos
      </a>

      <a
        href="drops.html"
        class="admin-menu-link active"
      >
        Drops
      </a>

      <a
        href="campanha.html"
        class="admin-menu-link"
      >
        Campanha
      </a>

      <a
        href="pedidos.html"
        class="admin-menu-link"
      >
        Pedidos
      </a>

    </nav>


    <button
      type="button"
      class="admin-logout js-admin-sair"
    >
      Sair
    </button>


  </aside>



  <!-- CONTEÚDO -->

  <main class="admin-content">


    <header class="admin-page-header">

      <div>

        <span class="admin-page-label">
          HOME / DESTAQUES
        </span>

        <h1>
          Drops
        </h1>

        <p>
          Escolha quais produtos aparecem
          nos destaques da Home.
        </p>

      </div>


      <a
        href="/hazedrip/frontend/index.html"
        target="_blank"
        class="admin-view-store"
      >
        Ver Home
      </a>

    </header>



    <!-- RESUMO -->

    <section class="admin-drops-summary">

      <div>

        <span>
          Produtos em destaque
        </span>

        <strong id="drops-total-destaques">
          —
        </strong>

      </div>


      <div>

        <span>
          Produtos disponíveis
        </span>

        <strong id="drops-total-produtos">
          —
        </strong>

      </div>

    </section>



    <!-- BUSCA -->

    <section class="admin-products-toolbar">

      <div class="admin-search">

        <input
          type="search"
          id="drops-busca"
          placeholder="Buscar produto..."
        >

      </div>

    </section>



    <!-- MENSAGEM -->

    <div
      id="drops-mensagem"
      class="admin-form-message"
    ></div>



    <!-- PRODUTOS -->

    <section
      id="drops-grid"
      class="admin-drops-grid"
    >

      <div class="admin-loading">
        Carregando produtos...
      </div>

    </section>


  </main>


</div>


<script src="config.js"></script>


<script src="admin.js"></script>
<script src="drops.js"></script>


</body>

</html>
