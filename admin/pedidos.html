<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Pedidos | Haze Drip Admin
  </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="admin.css"
  >
  <link
  rel="stylesheet"
  href="pedidos.css"
>
</head>

<body class="admin-body pedidos-page">

  <div class="admin-layout">

    <aside class="admin-sidebar">

      <div class="admin-logo">
        HAZE DRIP
      </div>

      <nav class="admin-nav">

        <a href="dashboard.html">
          Dashboard
        </a>

        <a href="produtos.html">
          Produtos
        </a>

        <a
          href="pedidos.html"
          class="active"
        >
          Pedidos
        </a>

        <a href="drops.html">
          Drops
        </a>

        <a href="campanha.html">
          Campanha
        </a>

      </nav>

    </aside>


    <main class="admin-main">

      <div class="admin-page-header">

        <div>

          <span class="admin-eyebrow">
            Gestão
          </span>

          <h1>
            Pedidos
          </h1>

          <p class="admin-muted-text">
            Acompanhe os pedidos recebidos pela loja.
          </p>

        </div>

      </div>


      <section class="admin-card">

          <div class="pedidos-filtros">

  <input
    type="text"
    id="pedidos-busca"
    class="form-control bg-dark text-light border-secondary"
    placeholder="Buscar por pedido, cliente ou e-mail"
  >


  <select
    id="pedidos-filtro-status"
    class="form-select bg-dark text-light border-secondary"
  >

    <option value="">
      Todos os status
    </option>

    <option value="aguardando_pagamento">
      Aguardando pagamento
    </option>

    <option value="pago">
      Pago
    </option>

    <option value="em_preparacao">
      Em preparação
    </option>

    <option value="enviado">
      Enviado
    </option>

    <option value="entregue">
      Entregue
    </option>

    <option value="cancelado">
      Cancelado
    </option>

  </select>

</div>
        
        <div
          id="pedidos-mensagem"
          class="admin-muted-text"
        >
          Carregando pedidos...
        </div>


        <div class="table-responsive">

          <table
            class="table
                   table-dark
                   table-hover
                   align-middle"
          >

            <thead>

              <tr>

                <th>
                  Pedido
                </th>

                <th>
                  Cliente
                </th>

                <th>
                  E-mail
                </th>

                <th>
                  Total
                </th>

                <th>
                  Status
                </th>

                <th>
                  Ações
                </th>

              </tr>

            </thead>


            <tbody
              id="pedidos-lista"
            >
            </tbody>

          </table>

        </div>

      </section>

    </main>

  </div>


  <script src="pedidos.js"></script>

</body>

</html>
