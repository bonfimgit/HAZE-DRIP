<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cupons — Haze Drip Admin</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="admin.css"
  >
  <link
  rel="stylesheet"
  href="pedidos.css"
>
</head>

<body class="admin-body pedidos-page">

  <div class="admin-layout">

    <aside class="admin-sidebar">

      <div class="admin-logo">
        HAZE DRIP
      </div>

      <nav class="admin-nav">

        <a href="dashboard.html">
          Dashboard
        </a>

        <a href="produtos.html">
          Produtos
        </a>

        <a
          href="pedidos.html"
          class="active"
        >
          Pedidos
        </a>

        <a href="drops.html">
          Drops
        </a>

        <a href="campanha.html">
          Campanha
        </a>

      </nav>

    </aside>


    <!-- titulo: Cupons -->
<!-- script: cupons.js -->
<main class="admin-main">

      <div class="admin-page-header">
        <div>
          <span class="admin-eyebrow">Promoções</span>
          <h1>Cupons</h1>
          <p class="admin-muted-text">Descontos aplicados pelo cliente no checkout.</p>
        </div>
      </div>

      <section class="admin-card mb-4">
        <h3 id="cupom-form-titulo">Novo cupom</h3>

        <form id="cupom-form" class="row g-3 mt-1" novalidate>
          <input type="hidden" id="cupom-id">

          <div class="col-md-3">
            <label class="form-label" for="cupom-codigo">Código</label>
            <input type="text" id="cupom-codigo" maxlength="40" class="form-control bg-dark text-light border-secondary text-uppercase" placeholder="HAZE10" required>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="cupom-tipo">Tipo</label>
            <select id="cupom-tipo" class="form-select bg-dark text-light border-secondary">
              <option value="percentual">Percentual (%)</option>
              <option value="fixo">Valor fixo (R$)</option>
              <option value="frete_gratis">Frete grátis</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label" for="cupom-valor">Valor</label>
            <input type="number" id="cupom-valor" min="0" step="0.01" class="form-control bg-dark text-light border-secondary">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="cupom-descricao">Descrição (interna)</label>
            <input type="text" id="cupom-descricao" maxlength="255" class="form-control bg-dark text-light border-secondary">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="cupom-minimo">Compra mínima (R$)</label>
            <input type="number" id="cupom-minimo" min="0" step="0.01" class="form-control bg-dark text-light border-secondary" placeholder="Opcional">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="cupom-inicio">Início</label>
            <input type="datetime-local" id="cupom-inicio" class="form-control bg-dark text-light border-secondary">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="cupom-fim">Fim</label>
            <input type="datetime-local" id="cupom-fim" class="form-control bg-dark text-light border-secondary">
          </div>
          <div class="col-md-3"></div>
          <div class="col-md-3">
            <label class="form-label" for="cupom-limite-total">Limite total de usos</label>
            <input type="number" id="cupom-limite-total" min="1" step="1" class="form-control bg-dark text-light border-secondary" placeholder="Sem limite">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="cupom-limite-cliente">Limite por cliente</label>
            <input type="number" id="cupom-limite-cliente" min="1" step="1" class="form-control bg-dark text-light border-secondary" placeholder="Sem limite">
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="cupom-ativo" checked>
              <label class="form-check-label" for="cupom-ativo">Ativo</label>
            </div>
          </div>

          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-light">Salvar cupom</button>
            <button type="button" class="btn btn-outline-light" id="cupom-limpar">Limpar</button>
          </div>
          <div class="col-12 admin-muted-text" id="cupom-mensagem" role="status"></div>
        </form>
      </section>

      <section class="admin-card">
        <h3>Cupons cadastrados</h3>
        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle">
            <thead>
              <tr>
                <th>Código</th>
                <th>Desconto</th>
                <th>Regras</th>
                <th>Validade</th>
                <th>Usos</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="cupons-lista"></tbody>
          </table>
        </div>
      </section>

    </main>


  </div>


  <script src="config.js"></script>
  <script src="admin.js"></script>
  <script src="cupons.js"></script>

</body>

</html>
