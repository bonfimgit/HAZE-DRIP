<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Frete — Haze Drip Admin</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="admin.css"
  >
  <link
  rel="stylesheet"
  href="pedidos.css"
>
</head>

<body class="admin-body pedidos-page">

  <div class="admin-layout">

    <aside class="admin-sidebar">

      <div class="admin-logo">
        HAZE DRIP
      </div>

      <nav class="admin-nav">

        <a href="dashboard.html">
          Dashboard
        </a>

        <a href="produtos.html">
          Produtos
        </a>

        <a
          href="pedidos.html"
          class="active"
        >
          Pedidos
        </a>

        <a href="drops.html">
          Drops
        </a>

        <a href="campanha.html">
          Campanha
        </a>

      </nav>

    </aside>


    <!-- titulo: Frete -->
<!-- script: frete.js -->
<main class="admin-main">

      <div class="admin-page-header">
        <div>
          <span class="admin-eyebrow">Vendas</span>
          <h1>Frete</h1>
          <p class="admin-muted-text">
            Regras por faixa de CEP, por estado ou para todo o Brasil.
            A regra mais específica vence: faixa de CEP &gt; estado &gt; padrão.
          </p>
        </div>
      </div>

      <section class="admin-card mb-4">
        <h3 id="frete-form-titulo">Nova regra</h3>

        <form id="frete-form" class="row g-3 mt-1" novalidate>
          <input type="hidden" id="frete-id">

          <div class="col-md-4">
            <label class="form-label" for="frete-nome">Nome</label>
            <input type="text" id="frete-nome" maxlength="100" class="form-control bg-dark text-light border-secondary" placeholder="Ex.: Sudeste" required>
          </div>
          <div class="col-md-2">
            <label class="form-label" for="frete-uf">UF (opcional)</label>
            <input type="text" id="frete-uf" maxlength="2" class="form-control bg-dark text-light border-secondary" placeholder="MG">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="frete-cep-inicio">CEP inicial (opcional)</label>
            <input type="text" id="frete-cep-inicio" maxlength="9" class="form-control bg-dark text-light border-secondary" placeholder="37900-000">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="frete-cep-fim">CEP final</label>
            <input type="text" id="frete-cep-fim" maxlength="9" class="form-control bg-dark text-light border-secondary" placeholder="37999-999">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="frete-valor">Valor (R$)</label>
            <input type="number" id="frete-valor" min="0" step="0.01" class="form-control bg-dark text-light border-secondary" required>
          </div>
          <div class="col-md-2">
            <label class="form-label" for="frete-prazo-min">Prazo mín. (dias)</label>
            <input type="number" id="frete-prazo-min" min="0" step="1" class="form-control bg-dark text-light border-secondary" required>
          </div>
          <div class="col-md-2">
            <label class="form-label" for="frete-prazo-max">Prazo máx. (dias)</label>
            <input type="number" id="frete-prazo-max" min="0" step="1" class="form-control bg-dark text-light border-secondary" required>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="frete-gratis">Grátis acima de (R$)</label>
            <input type="number" id="frete-gratis" min="0" step="0.01" class="form-control bg-dark text-light border-secondary" placeholder="Opcional">
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="frete-ativo" checked>
              <label class="form-check-label" for="frete-ativo">Ativa</label>
            </div>
          </div>

          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-light">Salvar regra</button>
            <button type="button" class="btn btn-outline-light" id="frete-limpar">Limpar</button>
          </div>
          <div class="col-12 admin-muted-text" id="frete-mensagem" role="status"></div>
        </form>
      </section>

      <section class="admin-card mb-4">
        <h3>Regras</h3>
        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Abrangência</th>
                <th>Valor</th>
                <th>Prazo</th>
                <th>Grátis acima de</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="frete-lista"></tbody>
          </table>
        </div>
      </section>

      <section class="admin-card">
        <h3>Simular</h3>
        <form id="frete-simulador" class="row g-2 mt-1" novalidate>
          <div class="col-md-3">
            <input type="text" id="simular-cep" maxlength="9" class="form-control bg-dark text-light border-secondary" placeholder="CEP" aria-label="CEP">
          </div>
          <div class="col-md-2">
            <input type="text" id="simular-uf" maxlength="2" class="form-control bg-dark text-light border-secondary" placeholder="UF" aria-label="UF">
          </div>
          <div class="col-md-3">
            <input type="number" id="simular-valor" min="0" step="0.01" class="form-control bg-dark text-light border-secondary" placeholder="Valor dos produtos" aria-label="Valor dos produtos">
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-outline-light w-100">Simular</button>
          </div>
        </form>
        <p class="mt-3 mb-0" id="simular-resultado" role="status"></p>
      </section>

    </main>


  </div>


  <script src="config.js"></script>
  <script src="admin.js"></script>
  <script src="frete.js"></script>

</body>

</html>
