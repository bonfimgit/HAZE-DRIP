<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Editar produto — Haze Drip
  </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>


<body class="admin-body">


<div class="admin-layout">


  <!-- SIDEBAR -->

  <aside class="admin-sidebar">


    <div class="admin-brand">

      <img
        src="/hazedrip/assets/haze-logo.png"
        alt="Haze Drip"
      >

      <span>
        ADMIN
      </span>

    </div>


    <div class="admin-user">

      <div class="admin-avatar">
        HD
      </div>

      <div>

        <strong class="js-admin-nome">
          Gerente
        </strong>

        <span class="js-admin-perfil">
          Gerente
        </span>

      </div>

    </div>


    <nav class="admin-menu">

      <a
        href="dashboard.html"
        class="admin-menu-link"
      >
        Dashboard
      </a>

      <a
        href="produtos.html"
        class="admin-menu-link active"
      >
        Produtos
      </a>

      <a
        href="drops.html"
        class="admin-menu-link"
      >
        Drops
      </a>

      <a
        href="campanha.html"
        class="admin-menu-link"
      >
        Campanha
      </a>

      <a
        href="pedidos.html"
        class="admin-menu-link"
      >
        Pedidos
      </a>

    </nav>


    <button
      type="button"
      class="admin-logout js-admin-sair"
    >
      Sair
    </button>


  </aside>



  <!-- CONTEÚDO -->

  <main class="admin-content">


    <header class="admin-page-header">

      <div>

        <a
          href="produtos.html"
          class="admin-back-link"
        >
          ← Voltar para produtos
        </a>

        <span class="admin-page-label">
          PRODUTOS
        </span>

        <h1>
          Editar produto
        </h1>

        <p id="editar-produto-id">
          Carregando...
        </p>

      </div>


      <a
        href="#"
        target="_blank"
        id="editar-ver-produto"
        class="admin-view-store"
      >
        Ver na loja
      </a>

    </header>



    <form
      id="editar-produto-form"
      class="admin-edit-form"
    >


      <!-- DADOS PRINCIPAIS -->

      <section class="admin-form-card">


        <div class="admin-form-card-header">

          <div>

            <span>
              INFORMAÇÕES
            </span>

            <h2>
              Dados do produto
            </h2>

          </div>

        </div>



        <div class="admin-form-grid">


          <div class="admin-form-group admin-form-full">

            <label for="editar-nome">
              Nome
            </label>

            <input
              type="text"
              id="editar-nome"
              required
            >

          </div>



          <div class="admin-form-group admin-form-full">

            <label for="editar-descricao">
              Descrição
            </label>

            <textarea
              id="editar-descricao"
              rows="6"
            ></textarea>

          </div>



          <div class="admin-form-group">

            <label for="editar-preco">
              Preço
            </label>

            <input
              type="number"
              id="editar-preco"
              min="0"
              step="0.01"
              required
            >

          </div>



          <div class="admin-form-group">

            <label for="editar-categoria">
              Categoria
            </label>

            <select
              id="editar-categoria"
              required
            >

              <option value="">
                Carregando categorias...
              </option>

            </select>

          </div>


        </div>


      </section>



      <!-- VISIBILIDADE -->

      <section class="admin-form-card">


        <div class="admin-form-card-header">

          <div>

            <span>
              VISIBILIDADE
            </span>

            <h2>
              Loja
            </h2>

          </div>

        </div>



        <div class="admin-toggle-list">


          <label class="admin-toggle-item">

            <div>

              <strong>
                Produto ativo
              </strong>

              <span>
                Produto disponível na loja.
              </span>

            </div>

            <input
              type="checkbox"
              id="editar-ativo"
            >

          </label>



          <label class="admin-toggle-item">

            <div>

              <strong>
                Drop em destaque
              </strong>

              <span>
                Mostrar este produto nos
                destaques da Home.
              </span>

            </div>

            <input
              type="checkbox"
              id="editar-destaque"
            >

          </label>


        </div>


      </section>



      <!-- FOTOS -->

      <section class="admin-form-card">


        <div class="admin-form-card-header">

          <div>

            <span>
              MÍDIA
            </span>

            <h2>
              Fotos do produto
            </h2>

          </div>

        </div>


        <div id="editar-preview-fotos"
             class="admin-edit-images">

          <p>
            Carregando imagens...
          </p>

        </div>


        <button
          type="button"
          class="admin-secondary-btn"
          id="editar-gerenciar-fotos"
        >
          Gerenciar fotos
        </button>


      </section>

      <a
         href="#"
         id="editar-gerenciar-variacoes"
         class="admin-secondary-btn"
      >
            Estoque e variações
      </a>


      <!-- MENSAGEM -->

      <div
        id="editar-produto-mensagem"
        class="admin-form-message"
      ></div>



      <!-- BOTÕES -->

      <div class="admin-form-actions">


        <a
          href="produtos.html"
          class="admin-cancel-btn"
        >
          Cancelar
        </a>


        <button
          type="submit"
          id="editar-produto-salvar"
          class="admin-primary-btn"
        >
          Salvar alterações
        </button>


      </div>


    </form>


  </main>


</div>


<script src="admin.js"></script>
<script src="produto-editar.js"></script>


</body>

</html>
