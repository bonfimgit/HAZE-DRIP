<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Haze Drip — Admin</title>


  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >


  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>


<body class="admin-login-body">


  <main class="admin-login">

    <section class="admin-login-card">


      <div class="admin-login-logo">

        <img
          src="../assets/haze-logo.png"
          alt="Haze Drip"
        >

        <span>
          PAINEL ADMINISTRATIVO
        </span>

      </div>


      <div class="admin-login-head">

        <h1>
          Acessar painel
        </h1>

        <p>
          Entre com sua conta de gerente.
        </p>

      </div>


      <form id="admin-login-form">


        <div class="admin-field">

          <label for="admin-email">
            E-mail
          </label>

          <input
            type="email"
            id="admin-email"
            class="form-control"
            autocomplete="email"
            placeholder="seu@email.com"
            required
          >

        </div>


        <div class="admin-field">

          <label for="admin-senha">
            Senha
          </label>


          <div class="admin-password">

            <input
              type="password"
              id="admin-senha"
              class="form-control"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            >


            <button
              type="button"
              id="admin-ver-senha"
              aria-label="Mostrar senha"
            >

              👁

            </button>

          </div>

        </div>


        <div
          class="admin-login-erro"
          id="admin-login-erro"
        ></div>


        <button
          type="submit"
          class="admin-login-btn"
          id="admin-login-btn"
        >

          ENTRAR

        </button>


      </form>


      <p class="admin-login-security">
        Área restrita aos administradores Haze Drip.
      </p>


    </section>

  </main>


  <script src="config.js"></script>


  <script src="login.js"></script>

</body>

</html>
