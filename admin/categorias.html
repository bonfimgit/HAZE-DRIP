<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Categorias — Haze Drip Admin</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="admin.css"
  >
  <link
  rel="stylesheet"
  href="pedidos.css"
>
</head>

<body class="admin-body pedidos-page">

  <div class="admin-layout">

    <aside class="admin-sidebar">

      <div class="admin-logo">
        HAZE DRIP
      </div>

      <nav class="admin-nav">

        <a href="dashboard.html">
          Dashboard
        </a>

        <a href="produtos.html">
          Produtos
        </a>

        <a
          href="pedidos.html"
          class="active"
        >
          Pedidos
        </a>

        <a href="drops.html">
          Drops
        </a>

        <a href="campanha.html">
          Campanha
        </a>

      </nav>

    </aside>


    <!-- titulo: Categorias -->
<!-- script: categorias.js -->
<main class="admin-main">

      <div class="admin-page-header">
        <div>
          <span class="admin-eyebrow">Catálogo</span>
          <h1>Categorias</h1>
          <p class="admin-muted-text">
            Categorias aparecem no cadastro de produtos e nos filtros da loja.
            Desativar esconde a categoria sem apagar os produtos dela.
          </p>
        </div>
      </div>

      <section class="admin-card mb-4">
        <h3 id="categoria-form-titulo">Nova categoria</h3>

        <form id="categoria-form" class="row g-3 mt-1" novalidate>
          <input type="hidden" id="categoria-id">

          <div class="col-md-6">
            <label class="form-label" for="categoria-nome">Nome</label>
            <input type="text" id="categoria-nome" maxlength="100" class="form-control bg-dark text-light border-secondary" placeholder="Ex.: Camisetas" required>
          </div>

          <div class="col-12 d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-light">Salvar categoria</button>
            <button type="button" class="btn btn-outline-light" id="categoria-limpar">Limpar</button>
            <button type="button" class="btn btn-outline-light" id="categorias-padrao">Criar categorias padrão</button>
          </div>
          <div class="col-12 admin-muted-text" id="categoria-mensagem" role="status"></div>
        </form>
      </section>

      <section class="admin-card">
        <h3>Categorias cadastradas</h3>
        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="categoria-lista"></tbody>
          </table>
        </div>
      </section>

    </main>


  </div>


  <script src="config.js"></script>
  <script src="admin.js"></script>
  <script src="categorias.js"></script>

</body>

</html>
