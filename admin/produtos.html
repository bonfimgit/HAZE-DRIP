<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Produtos — Haze Drip
  </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>


<body class="admin-body">


<div class="admin-layout">


  <!-- SIDEBAR -->

  <aside class="admin-sidebar">

    <div class="admin-brand">

      <img
        src="../assets/haze-logo.webp"
        alt="Haze Drip"
      >

      <span>
        ADMIN
      </span>

    </div>


    <div class="admin-user">

      <div class="admin-avatar">
        HD
      </div>

      <div>

        <strong class="js-admin-nome">
          Gerente
        </strong>

        <span class="js-admin-perfil">
          Gerente
        </span>

      </div>

    </div>


    <nav class="admin-menu">

      <a
        href="dashboard.html"
        class="admin-menu-link"
      >
        Dashboard
      </a>

      <a
        href="produtos.html"
        class="admin-menu-link active"
      >
        Produtos
      </a>

      <a
        href="drops.html"
        class="admin-menu-link"
      >
        Drops
      </a>

      <a
        href="campanha.html"
        class="admin-menu-link"
      >
        Campanha
      </a>

      <a
        href="pedidos.html"
        class="admin-menu-link"
      >
        Pedidos
      </a>

    </nav>


    <button
      type="button"
      class="admin-logout js-admin-sair"
    >
      Sair
    </button>

  </aside>



  <!-- CONTEÚDO -->

  <main class="admin-content">


    <header class="admin-page-header">

      <div>

        <span class="admin-page-label">
          CATÁLOGO
        </span>

        <h1>
          Produtos
        </h1>

        <p>
          Gerencie os produtos disponíveis na loja.
        </p>

      </div>


      <button
        type="button"
        class="admin-primary-btn"
        id="admin-novo-produto"
      >
        + Novo produto
      </button>

    </header>



    <!-- BARRA DE BUSCA -->

    <section class="admin-products-toolbar">

      <div class="admin-search">

        <input
          type="search"
          id="admin-produto-busca"
          placeholder="Buscar produto..."
        >

      </div>


      <span id="admin-produtos-contador">
        0 produtos
      </span>

    </section>



    <!-- TABELA -->

    <section class="admin-table-card">


      <div class="admin-table-responsive">


        <table class="admin-table">

          <thead>

            <tr>

              <th>
                Foto
              </th>

              <th>
                Produto
              </th>

              <th>
                Categoria
              </th>

              <th>
                Preço
              </th>

              <th>
                Status
              </th>

              <th>
                Ações
              </th>

            </tr>

          </thead>


          <tbody id="admin-produtos-lista">

            <tr>

              <td colspan="6">

                <div class="admin-loading">
                  Carregando produtos...
                </div>

              </td>

            </tr>

          </tbody>


        </table>


      </div>


    </section>


  </main>


</div>


<script src="config.js"></script>


<script src="admin.js"></script>

<script src="produtos.js"></script>


</body>

</html>
