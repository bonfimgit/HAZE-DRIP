<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Detalhes do Pedido | Haze Drip Admin
  </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="admin.css"
  >

  <link
    rel="stylesheet"
    href="pedidos.css"
  >
</head>

<body class="admin-body pedidos-page">

  <div class="admin-layout">

    <aside class="admin-sidebar">

      <div class="admin-logo">
        HAZE DRIP
      </div>

      <nav class="admin-nav">

        <a href="dashboard.html">
          Dashboard
        </a>

        <a href="produtos.html">
          Produtos
        </a>

        <a
          href="pedidos.html"
          class="active"
        >
          Pedidos
        </a>

        <a href="drops.html">
          Drops
        </a>

        <a href="campanha.html">
          Campanha
        </a>

      </nav>

    </aside>


    <main class="admin-main">

      <a
        href="pedidos.html"
        class="btn btn-sm btn-outline-light mb-4"
      >
        ← Voltar para pedidos
      </a>


      <div class="admin-page-header">

        <div>

          <span class="admin-eyebrow">
            Pedido
          </span>

          <h1
            id="pedido-titulo"
          >
            Carregando...
          </h1>

          <p
            id="pedido-status"
            class="admin-muted-text"
          >
          </p>

          <div class="mt-3">

  <label
    for="pedido-status-select"
    class="form-label"
  >
    Alterar status
  </label>


  <div class="d-flex gap-2">

    <select
      id="pedido-status-select"
      class="form-select bg-dark text-light border-secondary"
    >
    </select>


    <button
      type="button"
      id="pedido-status-salvar"
      class="btn btn-outline-light"
    >
      ATUALIZAR STATUS
    </button>

  </div>

  <!-- Rastreio: preenchido ao marcar como enviado e editável depois -->
  <div id="pedido-rastreio" class="mt-3" hidden>

    <div class="row g-2">
      <div class="col-md-4">
        <label for="pedido-rastreio-codigo" class="form-label small">Código de rastreio</label>
        <input type="text" id="pedido-rastreio-codigo" maxlength="60" class="form-control bg-dark text-light border-secondary">
      </div>
      <div class="col-md-3">
        <label for="pedido-rastreio-transportadora" class="form-label small">Transportadora</label>
        <input type="text" id="pedido-rastreio-transportadora" maxlength="60" placeholder="Correios" class="form-control bg-dark text-light border-secondary">
      </div>
      <div class="col-md-5">
        <label for="pedido-rastreio-url" class="form-label small">Link de rastreio (opcional)</label>
        <input type="url" id="pedido-rastreio-url" maxlength="255" placeholder="https://" class="form-control bg-dark text-light border-secondary">
      </div>
    </div>

    <button type="button" id="pedido-rastreio-salvar" class="btn btn-sm btn-outline-light mt-2" hidden>
      SALVAR RASTREIO
    </button>

  </div>

  <div class="mt-4">

  <button
    type="button"
    id="pedido-cancelar"
    class="btn btn-outline-danger"
  >
    CANCELAR PEDIDO
  </button>

  <div
    id="pedido-cancelar-mensagem"
    class="mt-2"
  >
  </div>

</div>


  <div
    id="pedido-status-mensagem"
    class="mt-2"
  >
  </div>

</div>

        </div>

      </div>


      <div
        id="pedido-mensagem"
        class="admin-muted-text mb-4"
      >
        Carregando pedido...
      </div>


      <section class="admin-card mb-4">

        <h3>
          Cliente
        </h3>

        <p>
          <strong>Nome:</strong>
          <span id="pedido-cliente-nome"></span>
        </p>

        <p>
          <strong>E-mail:</strong>
          <span id="pedido-cliente-email"></span>
        </p>

        <p>
          <strong>Telefone:</strong>
          <span id="pedido-cliente-telefone"></span>
        </p>

      </section>


      <section class="admin-card mb-4">

        <h3>
          Endereço de entrega
        </h3>

        <p
          id="pedido-endereco"
        >
        </p>

      </section>


      <section class="admin-card mb-4">

        <h3>
          Itens do pedido
        </h3>

        <div class="table-responsive">

          <table
            class="table
                   table-dark
                   table-hover
                   align-middle"
          >

            <thead>

              <tr>

                <th>Produto</th>

                <th>SKU</th>

                <th>Cor</th>

                <th>Tamanho</th>

                <th>Qtd.</th>

                <th>Preço</th>

                <th>Subtotal</th>

              </tr>

            </thead>

            <tbody
              id="pedido-itens"
            >
            </tbody>

          </table>

        </div>

      </section>


      <section class="admin-card mb-4">

        <h3>
          Histórico
        </h3>

        <ol id="pedido-historico" class="pedido-historico"></ol>

      </section>


      <section class="admin-card">

        <h3>
          Resumo
        </h3>

        <p>
          <strong>Subtotal:</strong>
          <span id="pedido-subtotal"></span>
        </p>

        <p>
          <strong>Frete:</strong>
          <span id="pedido-frete"></span>
        </p>

        <p>
          <strong>Total:</strong>
          <span id="pedido-total"></span>
        </p>

      </section>

    </main>

  </div>


  <script src="config.js"></script>
  <script src="admin.js"></script>


  <script src="pedido-detalhes.js"></script>

</body>

</html>
