# Netlify: publica a raiz do repositório (loja servida na raiz a partir de frontend/, painel em /admin/)
[build]
  publish = "."
  command = ""

# Endereços da loja sem /frontend (ex.: /produto.html?id=3)
#
# Os arquivos continuam na pasta frontend/; o Netlify serve cada
# página pelo endereço curto (status 200 = reescrita interna, o
# navegador continua vendo o endereço curto).
#
# Endereço principal abre a loja
[[redirects]]
  from = "/"
  to = "/frontend/index.html"
  status = 200

# Links antigos com /frontend (e-mails já enviados, retorno da
# InfinitePay, favoritos) vão para o endereço curto, com a mesma
# consulta (?id=..., ?pedido=...)
[[redirects]]
  from = "/frontend"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/frontend/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/frontend/*"
  to = "/:splat"
  status = 301
  force = true

# Painel não tem index.html: entrada pelo login
[[redirects]]
  from = "/admin"
  to = "/admin/login.html"
  status = 302

[[redirects]]
  from = "/admin/"
  to = "/admin/login.html"
  status = 302

# Links antigos do deploy manual (/hazedrip/frontend/...)
[[redirects]]
  from = "/hazedrip/*"
  to = "/:splat"
  status = 301

# Código e documentação do backend não são servidos pelo site
[[redirects]]
  from = "/backend/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/"
  status = 302
  force = true

# Arquivos internos do repositório também não são servidos
[[redirects]]
  from = "/.github/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/screenshots/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/eslint.config.js"
  to = "/"
  status = 302
  force = true


# Qualquer endereço que não exista na raiz é procurado em frontend/
# (ex.: /produto.html serve frontend/produto.html). Fica por último:
# as regras acima têm prioridade, e o que existe na raiz (assets/,
# admin/) é servido normalmente.
[[redirects]]
  from = "/*"
  to = "/frontend/:splat"
  status = 200


# Cabeçalhos de segurança da loja e do painel
#
# Content-Security-Policy: de onde o navegador aceita carregar coisas.
#   script-src   só arquivos do próprio site e o Bootstrap 5.3.3
#                (nada de JavaScript inline: um XSS não roda)
#   style-src    'unsafe-inline' porque a loja usa style="..." em
#                alguns elementos (barras, larguras)
#   img-src      https: porque as fotos vêm do Cloudinary e de URLs
#                cadastradas no painel
#   connect-src  a API no Render e o ViaCEP (endereço pelo CEP)
#   frame-ancestors 'none'  ninguém abre o site dentro de um iframe
#                           (protege o painel de clickjacking)
#
# ATENÇÃO: se o endereço da API mudar (outro serviço no Render),
# troque https://haze-drip.onrender.com no connect-src abaixo.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://haze-drip.onrender.com https://viacep.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
