name: Testes da API

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: haze_drip_test
          MYSQL_USER: haze
          MYSQL_PASSWORD: haze
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Dependências que vão para o servidor: falha com vulnerabilidade
      # moderada ou maior (as de desenvolvimento, como o ESLint, ficam de fora)
      - name: Vulnerabilidades nas dependências (npm audit)
        run: npm run audit:prod

      - name: ESLint (backend, loja e painel)
        run: npm run lint

      - name: Verificar sintaxe do frontend e do painel
        working-directory: .
        run: for f in frontend/*.js admin/*.js; do node --check "$f"; done

      - name: Testes (MySQL 8)
        run: npm test
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: haze
          TEST_DB_PASSWORD: haze
          TEST_DB_NAME: haze_drip_test

  # Mesmos testes contra o TiDB (banco usado em produção: TiDB Cloud Starter)
  testes-tidb:
    runs-on: ubuntu-latest

    services:
      tidb:
        image: pingcap/tidb:v8.5.5
        ports:
          - 4000:4000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Aguardar o TiDB e criar banco e usuário de teste
        run: |
          for i in $(seq 1 60); do
            mysql -h127.0.0.1 -P4000 -uroot -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          mysql -h127.0.0.1 -P4000 -uroot -e "SELECT VERSION()"
          mysql -h127.0.0.1 -P4000 -uroot -e "
            CREATE DATABASE IF NOT EXISTS haze_drip_test;
            CREATE USER IF NOT EXISTS 'haze'@'%' IDENTIFIED BY 'haze';
            GRANT ALL PRIVILEGES ON *.* TO 'haze'@'%';"

      - name: Testes (TiDB)
        run: npm test
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 4000
          TEST_DB_USER: haze
          TEST_DB_PASSWORD: haze
          TEST_DB_NAME: haze_drip_test
